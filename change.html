<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ひらがなれんしゅう・全部つながらない版・iPhone入力修正</title>

<style id="page-style">@page{size:auto;margin:0}</style>

<style>
*{box-sizing:border-box}
:root{
  --cell:64mm;
  --gap:4mm;
  --page-w:245mm;
  --page-h:170mm;
}
body{
  margin:0;
  background:#eee;
  color:#222;
  font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;
}
.mode-radio{position:absolute;left:-9999px}

.controls{
  width:min(980px,calc(100% - 24px));
  margin:16px auto;
  padding:16px 18px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 2px 12px #0002;
}
.controls h2{margin:0 0 8px;font-size:18px}
.controls p{font-size:13px;line-height:1.6;margin:6px 0 12px}

.section-title{
  font-size:13px;
  font-weight:700;
  margin:14px 0 7px;
}
.paper-select{
  padding:8px 10px;
  font-size:15px;
}

.rows{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.edit-row{
  display:grid;
  grid-template-columns:42px 34px 74px minmax(130px,220px) 74px;
  gap:8px;
  align-items:center;
  padding:8px;
  border:1px solid #ddd;
  border-radius:10px;
}
.edit-row .no{
  font-weight:700;
  text-align:center;
}
.print-check{
  width:20px;
  height:20px;
  margin:auto;
}
.char-input{
  width:68px;
  font-size:28px;
  text-align:center;
  padding:5px;
}
.word-input{
  width:100%;
  font-size:18px;
  padding:7px 9px;
}
.remove-btn{
  margin:0;
  padding:7px 8px;
  border:1px solid #aaa;
  border-radius:8px;
  background:#fff;
  font-size:13px;
}
.add-btn{
  margin-top:10px;
  padding:9px 14px;
  border:1px solid #777;
  border-radius:8px;
  background:#fff;
  font-weight:700;
}

.mode-box{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}
.mode-label{
  display:inline-block;
  padding:9px 13px;
  border:1.5px solid #777;
  border-radius:9px;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
  background:#fff;
}
#mode-all:checked ~ .controls label[for="mode-all"],
#mode-mixed:checked ~ .controls label[for="mode-mixed"]{
  border-width:3px;
}

.print-btn{
  margin-top:14px;
  padding:11px 18px;
  border:1px solid #777;
  border-radius:8px;
  background:#fff;
  font-weight:700;
  font-size:15px;
}
.status{
  margin-top:10px;
  font-size:13px;
  font-weight:700;
}
.note{
  margin-top:8px;
  font-size:12px;
  line-height:1.6;
}

/* ページ */
.page{
  width:var(--page-w);
  height:var(--page-h);
  margin:0 auto 20px;
  padding:4mm;
  background:#fff;
  overflow:hidden;
}
.header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  height:14mm;
  margin-bottom:3mm;
}
h1{
  margin:0;
  font-size:19pt;
  letter-spacing:.08em;
}
.info{
  display:flex;
  gap:6mm;
  font-size:11pt;
}
.write-line{
  display:inline-block;
  width:35mm;
  height:7mm;
  border-bottom:1.4px solid #333;
  vertical-align:bottom;
}
.date-line{width:27mm}

.practice{
  display:grid;
  grid-template-columns:repeat(3,var(--cell));
  grid-template-rows:repeat(2,var(--cell));
  gap:var(--gap);
  justify-content:center;
}
.cell{
  position:relative;
  width:var(--cell);
  height:var(--cell);
  border:1.5px solid #555;
  background:#fff;
  overflow:hidden;
}
.cell:before,.cell:after{
  content:"";
  position:absolute;
  z-index:1;
  pointer-events:none;
}
.cell:before{
  left:50%;
  top:0;
  bottom:0;
  border-left:1px dashed #aaa;
  transform:translateX(-50%);
}
.cell:after{
  top:50%;
  left:0;
  right:0;
  border-top:1px dashed #aaa;
  transform:translateY(-50%);
}

.glyph-fallback{
  position:absolute;
  inset:1mm;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Yu Kyokasho","UD Digi Kyokasho NP-R","Hiragino Kaku Gothic ProN",sans-serif;
  font-size:48mm;
  line-height:1;
  transform:translateY(-1mm);
}
.model .glyph-fallback{
  font-weight:700;
  color:#111;
}
.practice-cell .glyph-fallback{
  font-weight:500;
  color:#D3D3D3;
}

/* つながらない練習字形 */
.kana-svg{
  position:absolute;
  inset:2mm;
  z-index:3;
  width:calc(100% - 4mm);
  height:calc(100% - 4mm);
}
.kana-stroke{
  fill:none;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.model .kana-stroke{
  stroke:#111;
  stroke-width:74;
}
.practice-cell .kana-stroke{
  stroke:#D3D3D3;
  stroke-width:74;
}

/* 書き順オーバーレイ */
.order-line{
  stroke:#111;
  stroke-width:16;
  fill:none;
  stroke-linecap:round;
}
.order-arrow{
  fill:#111;
}
.order-circle{
  fill:#fff;
  stroke:#111;
  stroke-width:9;
}
.order-text{
  fill:#111;
  font-size:78px;
  font-weight:700;
}

#mode-mixed:checked ~ .pages .self-cell .kana-svg,
#mode-mixed:checked ~ .pages .self-cell .glyph-fallback{
  display:none!important;
}

.word-area{
  width:var(--cell);
  height:var(--cell);
  border:1.5px solid #777;
  border-radius:3mm;
  display:grid;
  grid-template-rows:1fr 16mm;
  overflow:hidden;
}
.picture{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:11pt;
  color:#777;
  line-height:1.5;
  border-bottom:1px dashed #aaa;
  padding:2mm;
}
.word{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23pt;
  font-weight:700;
}
.order-title{
  position:absolute;
  z-index:15;
  top:1.5mm;
  right:1.5mm;
  font-size:7pt;
  font-weight:700;
  background:#fff;
  padding:0 1mm;
}
.error-badge{
  position:absolute;
  z-index:20;
  left:2mm;
  right:2mm;
  bottom:2mm;
  background:#fff;
  border:1px solid #999;
  padding:1mm;
  font-size:7.5pt;
  text-align:center;
}
.footer{
  margin-top:1mm;
  height:3mm;
  line-height:3mm;
  text-align:right;
  font-size:8pt;
  color:#777;
}

/* A4 */
body.paper-a4{
  --page-w:285mm;
  --page-h:198mm;
  --cell:73mm;
  --gap:5mm;
}
body.paper-a4 .page{padding:5mm}
body.paper-a4 .header{
  height:17mm;
  margin-bottom:3mm;
}
body.paper-a4 .glyph-fallback{font-size:55mm}
body.paper-a4 .model .kana-stroke,
body.paper-a4 .practice-cell .kana-stroke{
  stroke-width:80;
}

/* B5 */
body.paper-b5{
  --page-w:245mm;
  --page-h:170mm;
  --cell:64mm;
  --gap:4mm;
}

/* 画面上では印刷対象のみ表示 */
.page.not-selected{display:none}

@media print{
  html,body{
    margin:0!important;
    padding:0!important;
    background:#fff;
  }

  .controls,.mode-radio{
    display:none!important;
  }

  .page{
    display:block!important;
    margin:0 auto!important;
    overflow:hidden!important;
    box-sizing:border-box!important;
    break-inside:avoid!important;
    page-break-inside:avoid!important;
    break-after:page!important;
    page-break-after:always!important;
  }

  .page.not-selected{
    display:none!important;
  }

  .page.last-print-page{
    break-after:auto!important;
    page-break-after:auto!important;
  }

  *{
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
}
</style>
</head>

<body class="paper-auto">

<input class="mode-radio" type="radio" name="mode" id="mode-all" checked>
<input class="mode-radio" type="radio" name="mode" id="mode-mixed">

<section class="controls">
<h2>ひらがな練習・全部つながらない版</h2>
<p>
ひらがなの練習用に、<b>すべての文字を1画ずつ離れた形</b>で表示します。<br>
左のチェックが付いている文字だけ印刷します。<br>iPhoneの日本語キーボードでも追加した文字欄に入力できます。
</p>

<div class="section-title">用紙サイズ</div>
<select id="paperSize" class="paper-select">
  <option value="auto" selected>自動（プリンター側で選ぶ）</option>
  <option value="a4">A4 横</option>
  <option value="b5">B5 横</option>
</select>

<div class="section-title">練習する文字</div>
<div id="rows" class="rows"></div>

<button id="addRow" class="add-btn" type="button">＋ 1文字追加</button>

<div class="section-title">練習方法</div>
<div class="mode-box">
  <label class="mode-label" for="mode-all">4マス ぜんぶなぞる</label>
  <label class="mode-label" for="mode-mixed">2マスなぞる＋2マスじぶんで</label>
</div>

<button id="printButton" class="print-btn" type="button">チェックした文字を印刷</button>

<div id="status" class="status">準備中…</div>
<div class="note">
1文字＝1ページです。<br>
書き順データはネット接続中に読み込みます。読み込めないときは簡易表示になります。
</div>
</section>

<div id="pages" class="pages"></div>

<script>
const initialRows=[
  {char:"せ",word:"せみ",checked:true},
  {char:"い",word:"いぬ",checked:true},
  {char:"や",word:"やま",checked:true}
];

const cache=new Map();
let rowsData=[...initialRows];

function esc(s){
  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

async function loadKana(ch){
  if(cache.has(ch)) return cache.get(ch);

  const url="https://cdn.jsdelivr.net/npm/kana-svg-data/dist/hiragana/"
    + encodeURIComponent(ch) + ".json";

  const res=await fetch(url,{cache:"force-cache"});
  if(!res.ok) throw new Error("書き順データがありません");

  const data=await res.json();
  cache.set(ch,data);
  return data;
}

function groupStrokeMedians(data){
  const groups=new Map();

  for(const median of data.medians || []){
    const m=String(median.id).match(/^\d+/);
    const key=m ? m[0] : String(median.id);

    if(!groups.has(key)) groups.set(key,[]);
    groups.get(key).push(median);
  }

  return [...groups.entries()]
    .sort((a,b)=>Number(a[0])-Number(b[0]))
    .map(([id,parts])=>{
      const sortedParts=[...parts].sort((a,b)=>String(a.id).localeCompare(String(b.id), undefined, {numeric:true}));
      const points=[];
      sortedParts.forEach(part=>{
        if(Array.isArray(part.value)){
          part.value.forEach(p=>{
            if(Array.isArray(p) && p.length>=2) points.push([p[0],p[1]]);
          });
        }
      });
      return {id,points};
    });
}

function strokePathFromPoints(points){
  if(!points || !points.length) return "";

  if(points.length===1){
    const [x,y]=points[0];
    return `M ${x} ${y} L ${x+1} ${y+1}`;
  }

  // 角が出すぎないように簡易スムージング
  let d=`M ${points[0][0]} ${points[0][1]}`;
  for(let i=1;i<points.length-1;i++){
    const xc=(points[i][0]+points[i+1][0])/2;
    const yc=(points[i][1]+points[i+1][1])/2;
    d += ` Q ${points[i][0]} ${points[i][1]} ${xc} ${yc}`;
  }
  const last=points[points.length-1];
  d += ` T ${last[0]} ${last[1]}`;
  return d;
}

function orderGuideSvg(strokes){
  return strokes.map((s,i)=>{
    const pts=s.points;
    if(!pts.length) return "";

    const p0=pts[0];
    const p1=pts.length>1 ? pts[1] : [p0[0]+80,p0[1]];

    let dx=p1[0]-p0[0];
    let dy=p1[1]-p0[1];
    const len=Math.hypot(dx,dy) || 1;

    dx/=len;
    dy/=len;

    const x1=p0[0];
    const y1=p0[1];
    const x2=p0[0]+dx*115;
    const y2=p0[1]+dy*115;

    const cx=Math.max(55,Math.min(969,p0[0]-dx*62));
    const cy=Math.max(55,Math.min(969,p0[1]-dy*62));

    const ahx=x2;
    const ahy=y2;
    const back=55;
    const half=28;
    const perpX=-dy;
    const perpY=dx;
    const bx=ahx-dx*back;
    const by=ahy-dy*back;

    const pA=`${ahx},${ahy}`;
    const pB=`${bx+perpX*half},${by+perpY*half}`;
    const pC=`${bx-perpX*half},${by-perpY*half}`;

    return `
      <line class="order-line" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line>
      <polygon class="order-arrow" points="${pA} ${pB} ${pC}"></polygon>
      <circle class="order-circle" cx="${cx}" cy="${cy}" r="52"></circle>
      <text class="order-text" x="${cx}" y="${cy+27}" text-anchor="middle">${i+1}</text>
    `;
  }).join("");
}

function svgForSeparated(data,withOrder){
  const strokes=groupStrokeMedians(data);
  const strokePaths=strokes.map(s=>{
    const d=strokePathFromPoints(s.points);
    return d ? `<path class="kana-stroke" d="${d}"></path>` : "";
  }).join("");

  const order=withOrder ? orderGuideSvg(strokes) : "";

  return `<svg class="kana-svg" viewBox="0 0 1024 1024"
      xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      ${strokePaths}
      ${order}
    </svg>`;
}

function makeRow(index,data){
  const div=document.createElement("div");
  div.className="edit-row";
  div.dataset.index=index;

  div.innerHTML=`
    <div class="no">${index+1}</div>
    <input class="print-check" type="checkbox" ${data.checked ? "checked" : ""} aria-label="印刷する">
    <input class="char-input" value="${esc(data.char)}" aria-label="文字" inputmode="text" autocomplete="off">
    <input class="word-input" value="${esc(data.word)}" aria-label="ことば">
    <button class="remove-btn" type="button">削除</button>
  `;

  return div;
}

function renderRows(){
  const rows=document.getElementById("rows");
  rows.innerHTML="";

  rowsData.forEach((data,index)=>{
    rows.appendChild(makeRow(index,data));
  });

  bindRowEvents();
}

function bindRowEvents(){
  document.querySelectorAll(".edit-row").forEach(row=>{
    const index=Number(row.dataset.index);
    const checkbox=row.querySelector(".print-check");
    const charInput=row.querySelector(".char-input");
    const wordInput=row.querySelector(".word-input");
    const remove=row.querySelector(".remove-btn");

    checkbox.addEventListener("change",()=>{
      rowsData[index].checked=checkbox.checked;
      renderPages();
    });

    let isComposing=false;

    function commitChar(){
      const raw=charInput.value.trim();
      const first=Array.from(raw)[0] || "　";
      rowsData[index].char=first;
      charInput.value=first;
      renderPages();
    }

    /* iPhoneの日本語キーボードで「さ」「き」などを変換中に
       1文字へ切り詰めないようにする */
    charInput.addEventListener("compositionstart",()=>{
      isComposing=true;
    });

    charInput.addEventListener("compositionend",()=>{
      isComposing=false;
      commitChar();
    });

    charInput.addEventListener("input",()=>{
      if(isComposing) return;

      /* フリック入力など、変換を伴わず1文字入る場合 */
      const raw=charInput.value;
      if(Array.from(raw).length===1){
        rowsData[index].char=raw;
        renderPages();
      }
    });

    charInput.addEventListener("change",()=>{
      if(!isComposing) commitChar();
    });

    charInput.addEventListener("blur",()=>{
      if(!isComposing) commitChar();
    });

    wordInput.addEventListener("input",()=>{
      rowsData[index].word=wordInput.value;
      renderPages();
    });

    remove.addEventListener("click",()=>{
      rowsData.splice(index,1);

      if(rowsData.length===0){
        rowsData.push({char:"あ",word:"あひる",checked:true});
      }

      renderRows();
      renderPages();
    });
  });
}

function pageHtml(data,index){
  const ch=esc(data.char || "　");
  const word=esc(data.word || "");

  return `
  <div class="page ${data.checked ? "" : "not-selected"}" data-page-index="${index}">
    <div class="header">
      <h1><span class="title-char">${ch}</span> の れんしゅう</h1>
      <div class="info">
        <div>なまえ <span class="write-line"></span></div>
        <div>ひづけ <span class="write-line date-line"></span></div>
      </div>
    </div>

    <div class="practice">
      <div class="cell model">
        <div class="glyph-fallback">${ch}</div>
        <div class="order-title">かきじゅん</div>
      </div>

      <div class="cell practice-cell">
        <div class="glyph-fallback">${ch}</div>
      </div>

      <div class="cell practice-cell">
        <div class="glyph-fallback">${ch}</div>
      </div>

      <div class="word-area">
        <div class="picture">「${word}」の<br>えをかこう</div>
        <div class="word">${word}</div>
      </div>

      <div class="cell practice-cell self-cell">
        <div class="glyph-fallback">${ch}</div>
      </div>

      <div class="cell practice-cell self-cell">
        <div class="glyph-fallback">${ch}</div>
      </div>
    </div>

    <div class="footer">${index+1}ページ目</div>
  </div>`;
}

async function renderKanaOnPage(page,ch){
  page.querySelectorAll(".kana-svg,.error-badge").forEach(e=>e.remove());
  page.querySelectorAll(".glyph-fallback").forEach(e=>e.style.display="flex");

  try{
    const data=await loadKana(ch);

    const model=page.querySelector(".model");
    model.insertAdjacentHTML("beforeend",svgForSeparated(data,true));

    page.querySelectorAll(".practice-cell").forEach(cell=>{
      cell.insertAdjacentHTML("beforeend",svgForSeparated(data,false));
    });

    page.querySelectorAll(".glyph-fallback").forEach(e=>e.style.display="none");
    return true;

  }catch(err){
    const model=page.querySelector(".model");
    const badge=document.createElement("div");
    badge.className="error-badge";
    badge.textContent="書き順を読み込めませんでした";
    model.appendChild(badge);
    return false;
  }
}

async function renderPages(){
  const pages=document.getElementById("pages");
  pages.innerHTML=rowsData.map(pageHtml).join("");

  const selected=rowsData
    .map((x,i)=>({x,i}))
    .filter(o=>o.x.checked);

  document.querySelectorAll(".page").forEach(p=>p.classList.remove("last-print-page"));

  if(selected.length){
    const lastIndex=selected[selected.length-1].i;
    const last=document.querySelector(`.page[data-page-index="${lastIndex}"]`);
    if(last) last.classList.add("last-print-page");
  }

  document.getElementById("status").textContent=
    `印刷対象：${selected.length}文字（${selected.length}ページ）`;

  const jobs=[];

  rowsData.forEach((data,index)=>{
    if(!data.checked) return;
    const page=document.querySelector(`.page[data-page-index="${index}"]`);
    jobs.push(renderKanaOnPage(page,data.char));
  });

  const results=await Promise.all(jobs);
  const okCount=results.filter(Boolean).length;

  document.getElementById("status").textContent=
    `印刷対象：${selected.length}文字（${selected.length}ページ）／書き順表示OK：${okCount}文字`;
}

document.getElementById("addRow").addEventListener("click",()=>{
  rowsData.push({char:"あ",word:"あひる",checked:true});
  renderRows();
  renderPages();
});

document.getElementById("printButton").addEventListener("click",()=>{
  const selected=rowsData.filter(x=>x.checked).length;

  if(selected===0){
    alert("印刷する文字にチェックを入れてください。");
    return;
  }

  window.print();
});

/* 用紙 */
const paperSelect=document.getElementById("paperSize");
const pageStyle=document.getElementById("page-style");

function setPaperSize(){
  const v=paperSelect.value;
  document.body.classList.remove("paper-a4","paper-b5","paper-auto");

  if(v==="a4"){
    document.body.classList.add("paper-a4");
    pageStyle.textContent='@page{size:A4 landscape;margin:0}';
  }else if(v==="b5"){
    document.body.classList.add("paper-b5");
    pageStyle.textContent='@page{size:B5 landscape;margin:0}';
  }else{
    document.body.classList.add("paper-auto");
    pageStyle.textContent='@page{size:auto;margin:0}';
  }
}

paperSelect.addEventListener("change",setPaperSize);
setPaperSize();

renderRows();
renderPages();
</script>

</body>
</html>
